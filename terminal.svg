<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="350">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .terminal-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 16px;
                fill: #00F0FF;
            }
            .header-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 18px;
                font-weight: bold;
                fill: #00F0FF;
            }
            .accent {
                fill: #ffffff;
            }
        </style>
    </defs>

    <!-- Terminal Border -->
    <rect x="50" y="20" width="700" height="300" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)"/>
    <!-- Top Header Bar -->
    <rect x="50" y="20" width="700" height="40" fill="#00F0FF" fill-opacity="0.1" />
    <line x1="50" y1="60" x2="750" y2="60" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)"/>
    
    <!-- Title -->
    <text x="70" y="46" class="header-text" filter="url(#glow)">ARON.OS // SYSTEM TERMINAL</text>
    
    <!-- Content -->
    <text x="70" y="95" class="terminal-text" filter="url(#glow)">
        <tspan class="accent">$</tspan> initialize aron.os
    </text>

    <text x="70" y="140" class="terminal-text" filter="url(#glow)">&gt; loading robotics modules...</text>
    <text x="690" y="140" class="terminal-text accent" filter="url(#glow)">[OK]</text>

    <text x="70" y="170" class="terminal-text" filter="url(#glow)">&gt; initializing vision engine...</text>
    <text x="690" y="170" class="terminal-text accent" filter="url(#glow)">[OK]</text>

    <text x="70" y="200" class="terminal-text" filter="url(#glow)">&gt; connecting embedded systems...</text>
    <text x="690" y="200" class="terminal-text accent" filter="url(#glow)">[OK]</text>

    <text x="70" y="230" class="terminal-text" filter="url(#glow)">&gt; loading AI models...</text>
    <text x="690" y="230" class="terminal-text accent" filter="url(#glow)">[OK]</text>

    <text x="70" y="260" class="terminal-text" filter="url(#glow)">&gt; automation core online</text>
    <text x="690" y="260" class="terminal-text accent" filter="url(#glow)">[OK]</text>

    <line x1="50" y1="285" x2="750" y2="285" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4" stroke-opacity="0.3" />

    <text x="70" y="307" class="header-text" filter="url(#glow)">SYSTEM STATUS: <tspan class="accent">ONLINE</tspan></text>
</svg>
