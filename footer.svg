<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <style>
      .title { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; fill: #00F0FF; }
      .status { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; fill: #ffffff; }
      .bblr { font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; fill: #c9d1d9; }
      .bblr-highlight { font-family: 'Courier New', Courier, monospace; font-size: 22px; font-weight: bold; fill: #00F0FF; }
      .quote { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 18px; font-style: italic; fill: #00F0FF; font-weight: 500; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(400, 50)" text-anchor="middle">
    <text x="-40" y="0" class="title" filter="url(#glow)">[ SYSTEM STATUS ]</text>
    <text x="80" y="0" class="status">ONLINE</text>
    <circle cx="130" cy="-6" r="5" fill="#00F0FF" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(400, 100)" text-anchor="middle">
    <text y="0" class="bblr">BUILD.</text>
    <text y="28" class="bblr">BREAK.</text>
    <text y="56" class="bblr">LEARN.</text>
    <text y="86" class="bblr-highlight" filter="url(#glow)">> REBUILD_</text>
  </g>

  <g transform="translate(400, 230)" text-anchor="middle">
    <line x1="-200" y1="-30" x2="200" y2="-30" stroke="#00F0FF" stroke-opacity="0.3" filter="url(#glow)" stroke-dasharray="8 4"/>
    <text class="quote" filter="url(#glow)">"Engineering intelligence into the physical world."</text>
  </g>
</svg>
