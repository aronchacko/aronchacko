<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
    <defs>
        <!-- Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.1" />
        </pattern>
        <!-- Glowing Cyan Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Gradients -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050505" />
            <stop offset="100%" stop-color="#0A0F14" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Corner Accents -->
    <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 20 150 L 20 180 L 50 180" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 780 150 L 780 180 L 750 180" fill="none" stroke="#00F0FF" stroke-width="2" />

    <!-- Cybernetic / Circuit Lines -->
    <path d="M 0 100 L 150 100 L 170 120 L 630 120 L 650 100 L 800 100" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 200 0 L 200 40 L 220 60 L 580 60 L 600 40 L 600 0" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" />
    
    <circle cx="150" cy="100" r="3" fill="#00F0FF" filter="url(#glow)" />
    <circle cx="650" cy="100" r="3" fill="#00F0FF" filter="url(#glow)" />

    <!-- Text Group -->
    <g text-anchor="middle" font-family="'Courier New', Courier, monospace">
        <text x="400" y="105" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="8" filter="url(#glow)">ARON.OS</text>
        <text x="400" y="145" font-size="12" font-weight="normal" fill="#00F0FF" letter-spacing="4">ROBOTICS • AI • COMPUTER VISION • AUTOMATION</text>
    </g>

    <!-- UI Elements -->
    <rect x="360" y="160" width="80" height="4" fill="#00F0FF" opacity="0.8" />
    <text x="40" y="170" font-size="10" fill="#00F0FF" opacity="0.6" font-family="monospace">SYS.V.2.0.4</text>
    <text x="700" y="170" font-size="10" fill="#00F0FF" opacity="0.6" font-family="monospace">STATUS: ONLINE</text>
    
    <!-- Abstract Vision / Eye / Camera element -->
    <g transform="translate(400, 45)" stroke="#00F0FF" fill="none" opacity="0.5">
        <circle cx="0" cy="0" r="15" stroke-width="1.5" />
        <circle cx="0" cy="0" r="6" fill="#00F0FF" opacity="0.8" />
        <line x1="-25" y1="0" x2="-18" y2="0" stroke-width="1.5" />
        <line x1="18" y1="0" x2="25" y2="0" stroke-width="1.5" />
        <line x1="0" y1="-25" x2="0" y2="-18" stroke-width="1.5" />
        <line x1="0" y1="18" x2="0" y2="25" stroke-width="1.5" />
    </g>
</svg>
