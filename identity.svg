<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .header-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 22px;
                font-weight: bold;
                fill: #ffffff;
            }
            .body-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 15px;
                fill: #00F0FF;
                opacity: 0.9;
            }
            .accent {
                fill: #00F0FF;
            }
            .tag-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 13px;
                fill: #00F0FF;
                font-weight: bold;
            }
        </style>
    </defs>

    <!-- Header -->
    <text x="20" y="30" class="header-text" filter="url(#glow)"><tspan class="accent">░ </tspan>IDENTITY</text>

    <!-- Quote Border -->
    <rect x="20" y="55" width="4" height="45" fill="#00F0FF" filter="url(#glow)" />
    
    <!-- Body text -->
    <text x="35" y="70" class="body-text">I build intelligent machines and end-to-end automation systems at the</text>
    <text x="35" y="95" class="body-text">intersection of robotics, AI, computer vision and embedded systems.</text>

    <!-- Tag -->
    <rect x="20" y="118" width="230" height="26" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" rx="4" filter="url(#glow)" />
    <text x="30" y="136" class="tag-text" filter="url(#glow)">SENSE → THINK → DECIDE → ACT</text>

</svg>
