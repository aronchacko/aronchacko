<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .header-text {
                font-family: 'Courier New', Courier, monospace;
                font-size: 22px;
                font-weight: bold;
                fill: #ffffff;
            }
            .accent {
                fill: #00F0FF;
            }
        </style>
    </defs>

    <text x="20" y="40" class="header-text" filter="url(#glow)"><tspan class="accent">░ </tspan>CONTRIBUTION MATRIX</text>
    <line x1="20" y1="55" x2="300" y2="55" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)"/>
</svg>
